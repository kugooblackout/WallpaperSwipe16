name: Build WallpaperSwipe16

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14 # Используем стабильный раннер вместо macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Theos
        uses: Randomblock1/theos-action@v1

      - name: Build Package (Rootless)
        run: |
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: WallpaperSwipe16-deb
          path: packages/*.deb
